name: Deploy to GitHub Pages
run-name: Notion → Website · ${{ github.event_name }}

on:
  push:
    branches: "main"
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional reason for this manual Notion sync"
        required: false
        type: string
  repository_dispatch:
    # A Notion automation or another trusted integration can request an
    # immediate build after a human changes an article to Published.
    types: [notion-content-published]
  schedule:
    # 21:00 Asia/Shanghai. A failed Notion sync stops before deployment,
    # so the last successful website version remains live.
    - cron: "0 13 * * *"

concurrency:
  group: github-pages-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    outputs:
      pending: ${{ steps.pending.outputs.count }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Type-check and run release tests
        run: |
          npm run lint
          node --import tsx --test tests/*.test.mjs tests/*.test.ts tests/*.test.tsx tests/kitchen/*.test.mjs
          npm run test:notion-routing
          npm run test:notion-guards
          npm run test:analytics-policy
          npm run test:analytics-runtime
      - name: Check required Notion secrets
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          test -n "$NOTION_API_KEY"
          test -n "$NOTION_DATABASE_ID"
      - name: Build
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          STRICT_NOTION_SYNC: "true"
          VITE_GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          VITE_BING_SITE_VERIFICATION: ${{ secrets.BING_SITE_VERIFICATION }}
          VITE_BAIDU_SITE_VERIFICATION: ${{ secrets.BAIDU_SITE_VERIFICATION }}
        run: npm run build
      - name: Audit multilingual search intent and freight pages
        run: |
          npm run audit:search-intent
          node --import tsx scripts/test-freight-eight-languages.ts
          node scripts/test-market-static.mjs
      - name: Prepare first-publication candidates
        id: pending
        run: node scripts/prepare-blog-publication.mjs
      - name: Upload complete-template gate and URL fingerprints
        uses: actions/upload-artifact@v4
        with:
          name: url-manifest
          path: |
            artifacts/url-manifest.json
            artifacts/blog-template-validation.json
          if-no-files-found: error
      - name: Upload publication candidates
        uses: actions/upload-artifact@v4
        with:
          name: blog-publication-inputs
          path: artifacts/blog-pending.json
          if-no-files-found: error
      - name: Write auditable sync summary
        run: >-
          node --input-type=module -e "import fs from 'node:fs'; const posts=JSON.parse(fs.readFileSync('src/data/notionBlogData.json','utf8')); const lines=['## Notion content sync','','- Trigger: **'+process.env.GITHUB_EVENT_NAME+'**','- Published articles compiled: **'+posts.length+'**','- Build time: **'+new Date().toISOString()+'**','- Strict sync: **enabled**','']; fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n'));"
      - name: Upload Notion sync audit files
        uses: actions/upload-artifact@v4
        with:
          name: notion-sync-${{ github.run_id }}
          path: |
            src/data/notionBlogData.json
            src/data/notionRedirects.json
            dist/sitemap.xml
          retention-days: 14
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout verified release scripts
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Record successful Pages timestamp
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/capture-pages-receipt.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: pages-receipt
          path: artifacts/pages-receipt.json
          if-no-files-found: error
      - name: Verify the deployed sitemap remains reachable
        run: curl --fail --silent --show-error --max-time 30 --retry 2 https://www.ddnzglobal.com/sitemap.xml > /dev/null
      - name: Audit deployed security headers
        continue-on-error: true
        run: node scripts/check-security-headers.mjs https://www.ddnzglobal.com/

  write-publication:
    needs: [build, deploy]
    if: needs.build.outputs.pending != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    outputs:
      reconcile: ${{ steps.write.outputs.reconcile }}
      commit: ${{ steps.write.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: blog-publication-inputs
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: pages-receipt
          path: artifacts
      - name: Write the first publication time once
        id: write
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: node scripts/write-blog-publication.mjs

  reconcile-publication:
    needs: [deploy, write-publication]
    if: needs.write-publication.outputs.reconcile == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.write-publication.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate reconciled release
        run: |
          npm run lint
          node --import tsx --test tests/*.test.mjs tests/*.test.ts tests/*.test.tsx tests/kitchen/*.test.mjs
          npm run test:notion-routing
          npm run test:notion-guards
      - name: Rebuild full templates and preserve schema gate
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          STRICT_NOTION_SYNC: "true"
          VITE_GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          VITE_BING_SITE_VERIFICATION: ${{ secrets.BING_SITE_VERIFICATION }}
          VITE_BAIDU_SITE_VERIFICATION: ${{ secrets.BAIDU_SITE_VERIFICATION }}
        run: npm run build
      - name: Audit reconciled complete release
        run: |
          npm run audit:search-intent
          node --import tsx scripts/test-freight-eight-languages.ts
          node scripts/test-market-static.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: url-manifest-reconciled
          path: |
            artifacts/url-manifest.json
            artifacts/blog-template-validation.json
          if-no-files-found: error
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-reconciled
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-reconciled
      - name: Verify reconciled sitemap
        run: curl --fail --silent --show-error --max-time 30 --retry 2 https://www.ddnzglobal.com/sitemap.xml > /dev/null
      - name: Audit reconciled security headers
        continue-on-error: true
        run: node scripts/check-security-headers.mjs https://www.ddnzglobal.com/
