name: Deploy to GitHub Pages
run-name: Notion → Website · ${{ github.event_name }}

on:
  push:
    branches: "main"
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional reason for this manual Notion sync"
        required: false
        type: string
  repository_dispatch:
    # A Notion automation or another trusted integration can request an
    # immediate build after a human changes an article to Published.
    types: [notion-content-published]
  schedule:
    # 21:00 Asia/Shanghai. A failed Notion sync stops before deployment,
    # so the last successful website version remains live.
    - cron: "0 13 * * *"

concurrency:
  group: github-pages-production
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check required Notion secrets
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          test -n "$NOTION_API_KEY"
          test -n "$NOTION_DATABASE_ID"
      - name: Build
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          STRICT_NOTION_SYNC: "true"
          VITE_GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          VITE_BING_SITE_VERIFICATION: ${{ secrets.BING_SITE_VERIFICATION }}
          VITE_BAIDU_SITE_VERIFICATION: ${{ secrets.BAIDU_SITE_VERIFICATION }}
        run: npm run build
      - name: Write auditable sync summary
        run: >-
          node --input-type=module -e "import fs from 'node:fs'; const posts=JSON.parse(fs.readFileSync('src/data/notionBlogData.json','utf8')); const lines=['## Notion content sync','','- Trigger: **'+process.env.GITHUB_EVENT_NAME+'**','- Published articles compiled: **'+posts.length+'**','- Build time: **'+new Date().toISOString()+'**','- Strict sync: **enabled**','']; fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n'));"
      - name: Upload Notion sync audit files
        uses: actions/upload-artifact@v4
        with:
          name: notion-sync-${{ github.run_id }}
          path: |
            src/data/notionBlogData.json
            src/data/notionRedirects.json
            dist/sitemap.xml
          retention-days: 14
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout submission script
        uses: actions/checkout@v4
      - name: Set up Node for search-engine submission
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Submit deployed sitemap URLs to Baidu
        continue-on-error: true
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: >-
          node scripts/push-baidu-urls.mjs
          --sitemap https://www.ddnzglobal.com/sitemap.xml
          --recent-days ${{ github.event_name == 'schedule' && '2' || '0' }}
      - name: Submit deployed sitemap URLs to IndexNow
        continue-on-error: true
        run: >-
          node scripts/push-indexnow-urls.mjs
          --sitemap https://www.ddnzglobal.com/sitemap.xml
          --recent-days ${{ github.event_name == 'schedule' && '2' || '0' }}
      - name: Verify the deployed sitemap remains reachable
        run: curl --fail --silent --show-error --retry 6 --retry-delay 10 https://www.ddnzglobal.com/sitemap.xml > /dev/null
      - name: Audit deployed security headers
        continue-on-error: true
        run: node scripts/check-security-headers.mjs https://www.ddnzglobal.com/
