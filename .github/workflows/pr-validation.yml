name: Pull request validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Test multilingual Notion article routing
        run: npm run test:notion-routing

      - name: Test Notion publication guards
        run: npm run test:notion-guards

      - name: Test sourcing tools and release generation
        run: node --import tsx --test tests/*.test.mjs tests/*.test.ts tests/*.test.tsx tests/kitchen/*.test.mjs

      - name: Test analytics consent and payload safeguards
        run: npm run test:analytics-policy && npm run test:analytics-runtime

      - name: Build and audit the complete release from committed content
        run: npm run build:preview

      - name: Audit visible purchase and shipping intent
        run: npm run audit:search-intent

      - name: Validate freight pages in all eight languages
        run: node --import tsx scripts/test-freight-eight-languages.ts
