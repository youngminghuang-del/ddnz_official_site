<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Saudi gateway and cargo acceptance decision diagram</title>
  <desc id="desc">A decision diagram reminding importers to confirm cargo type, gateway, routing and live carrier acceptance before booking.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b31"/>
      <stop offset="1" stop-color="#123b65"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#001225" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1060" cy="92" r="160" fill="#f59e0b" opacity=".07"/>
  <circle cx="118" cy="620" r="210" fill="#38bdf8" opacity=".06"/>
  <text x="60" y="68" fill="#fbbf24" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">CHINA → SAUDI ARABIA</text>
  <text x="60" y="116" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800">CHECK GATEWAY + CARGO ACCEPTANCE</text>
  <text x="60" y="150" fill="#c8d7e8" font-family="Arial, Helvetica, sans-serif" font-size="20">A schedule or low rate is not a booking confirmation.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="220" width="250" height="170" rx="22" fill="#ffffff"/>
    <rect x="60" y="220" width="250" height="46" rx="22" fill="#0b2f55"/>
    <path d="M60 244h250v22H60z" fill="#0b2f55"/>
    <text x="88" y="251" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">1  DEFINE THE SHIPMENT</text>
    <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#17324d">
      <text x="88" y="302">Origin + cargo-ready date</text>
      <text x="88" y="334">Commodity + cargo type</text>
      <text x="88" y="366">Container + final Saudi city</text>
    </g>
  </g>

  <line x1="320" y1="305" x2="430" y2="305" stroke="#f59e0b" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="445" y="195" width="300" height="220" rx="24" fill="#ffffff"/>
    <rect x="445" y="195" width="300" height="50" rx="24" fill="#e9790f"/>
    <path d="M445 221h300v24H445z" fill="#e9790f"/>
    <text x="473" y="228" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800">2  CONFIRM CARGO ACCEPTANCE</text>
    <g font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">
      <rect x="478" y="278" width="112" height="46" rx="12" fill="#e8f4ff"/>
      <text x="512" y="307" fill="#0b4f81">DRY</text>
      <rect x="612" y="278" width="100" height="46" rx="12" fill="#dff7f2"/>
      <text x="629" y="307" fill="#087764">REEFER</text>
      <rect x="478" y="342" width="112" height="46" rx="12" fill="#fff1d7"/>
      <text x="516" y="371" fill="#9b5600">DG</text>
      <rect x="612" y="342" width="100" height="46" rx="12" fill="#fce7f3"/>
      <text x="638" y="371" fill="#9d174d">OOG</text>
    </g>
  </g>

  <line x1="755" y1="305" x2="830" y2="305" stroke="#f59e0b" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="845" y="182" width="295" height="250" rx="24" fill="#ffffff"/>
    <text x="875" y="226" fill="#0b2f55" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800">3  LOCK THE ACTUAL ROUTE</text>
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="875" y="250" width="235" height="46" rx="12" fill="#e8f4ff"/>
      <text x="895" y="279" fill="#0b4f81" font-size="17" font-weight="700">JEDDAH OPTION</text>
      <text x="875" y="327" fill="#17324d" font-size="16">Dammam / Jubail: confirm</text>
      <text x="875" y="352" fill="#17324d" font-size="16">direct call or landbridge</text>
      <text x="875" y="385" fill="#17324d" font-size="16">King Abdullah Port: confirm</text>
      <text x="875" y="410" fill="#17324d" font-size="16">cargo-specific acceptance</text>
    </g>
  </g>

  <g>
    <rect x="60" y="485" width="1080" height="120" rx="22" fill="#f7fafc" opacity=".98"/>
    <text x="90" y="525" fill="#0b2f55" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800">GET THESE IN WRITING BEFORE THE SUPPLIER RELEASES CARGO</text>
    <g fill="#17324d" font-family="Arial, Helvetica, sans-serif" font-size="17">
      <text x="90" y="565">✓ Port of discharge + place of delivery</text>
      <text x="430" y="565">✓ Carrier acceptance + routing</text>
      <text x="735" y="565">✓ Quote validity + contingency plan</text>
    </g>
  </g>
  <text x="60" y="648" fill="#9fb6cb" font-family="Arial, Helvetica, sans-serif" font-size="14">DDNZ original decision aid • Verify current carrier notices on the booking date</text>
</svg>
