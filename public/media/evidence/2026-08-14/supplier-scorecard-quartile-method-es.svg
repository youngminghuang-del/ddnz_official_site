bidi="plaintext" letter-spacing="0">Q1–Q2</text><text x="359.5" y="746" fill="#092649" font-family="Arial,'Helvetica Neue',sans-serif" font-size="23" font-weight="500" text-anchor="middle" direction="ltr" unicode-bidi="plaintext" letter-spacing="0">50–75 %</text><text x="574.5" y="746" fill="#092649" font-family="Arial,'Helvetica Neue',sans-serif" font-size="23" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext" letter-spacing="0">60 %</text><text x="829.5" y="746" fill="#092649" font-family="Arial,'Helvetica Neue',sans-serif" font-size="20" font-weight="500" text-anchor="middle" direction="ltr" unicode-bidi="plaintext" letter-spacing="0">Nivel medio-bajo</text><text x="144.5" y="822" fill="#092649" font-family="Arial,'Helvetica Neue',sans-serif" font-size="23" font-weight="500" text-anchor="middle" direction="ltr" unicode-bidi="plaintext" letter-spacing="0">&lt; Q1</text><text x="359.5" y="822" fill="#092649" font-family="Arial,'Helvetica Neue',sans-serif" font-size="23" font-weight="500" text-anchor="middle" direction="ltr" unicode-bidi="plaintext" letter-spacing="0">25 % inferior</text><text x="574.5" y="822" fill="#092649" font-family="Arial,'Helvetica Neue',sans-serif" font-size="23" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext" letter-spacing="0">40 %</text><text x="829.5" y="822" fill="#092649" font-family="Arial,'Helvetica Neue',sans-serif" font-size="20" font-weight="500" text-anchor="middle" direction="ltr" unicode-bidi="plaintext" letter-spacing="0">Requiere mejora</text><path d="M42 914H204M820 914H982" stroke="#6f2c91" stroke-width="3"/><text x="512" y="925" fill="#6f2c91" font-family="Arial,'Helvetica Neue',sans-serif" font-size="27" font-weight="800" text-anchor="middle" direction="ltr" unicode-bidi="plaintext" letter-spacing="0">REGLAS DE BONIFICACIÓN CONTROLADA</text><rect x="42" y="960" width="452" height="306" rx="12" fill="#fff" stroke="#6f2c91" stroke-width="2"/><path d="M42 972Q42 9