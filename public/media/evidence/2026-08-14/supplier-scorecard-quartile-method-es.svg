"/><path d="M530 972Q530 960 542 960H970Q982 960 982 972V1048H530Z" fill="url(#purpleGradient)"/><text x="756" y="1004" fill="#fff" font-family="Arial,'Helvetica Neue',sans-serif" font-size="20" font-weight="800" text-anchor="middle" direction="ltr" unicode-bidi="plaintext" letter-spacing="0">ESTABILIDAD DE CALIDAD</text><text x="756" y="1032" fill="#fff" font-family="Arial,'Helvetica Neue',sans-serif" font-size="17" font-weight="500" text-anchor="middle" direction="ltr" unicode-bidi="plaintext" letter-spacing="0" font-style="italic">Coeficiente de variación</text><text x="642" y="1102" fill="#092649" font-family="Arial,'Helvetica Neue',sans-serif" font-size="30" font-weight="500" text-anchor="middle" direction="ltr" unicode-bidi="plaintext" letter-spacing="0">&lt; 0.5%</text><path d="M760 1076V1118" stroke="#df4a23" stroke-width="2"/><text x="868" y="1104" fill="#df4a23" font-family="Arial,'Helvetica Neue',sans-serif" font-size="32" font-weight="800" text-anchor="middle" direction="ltr" unicode-bidi="plaintext" letter-spacing="0">+5</text><path d="M548 1134H964" stroke="#6f2c91" stroke-width="1.5" stroke-dasharray="5 5"/><text x="642" y="1174" fill="#092649" font-family="Arial,'Helvetica Neue',sans-serif" font-size="30" font-weight="500" text-anchor="middle" direction="ltr" unicode-bidi="plaintext" letter-spacing="0">&lt; 1.0%</text><path d="M760 1148V1190" stroke="#df4a23" stroke-width="2"/><text x="868" y="1176" fill="#df4a23" font-family="Arial,'Helvetica Neue',sans-serif" font-size="32" font-weight="800" text-anchor="middle" direction="ltr" unicode-bidi="plaintext" letter-spacing="0">+3</text><path d="M548 1206H964" stroke="#6f2c91" stroke-width="1.5" stroke-dasharray="5 5"/><text x="642" y="1246" fill="#092649" font-family="Arial,'Helvetica Neue',sans-serif" font-size="30" font-weight="500" text-anchor="middle" direction="ltr" unicode-bidi="plaintext" letter-spacing="0">≥ 1.0%</text><path d="M760 1220V1262" stroke="#df4a23" stroke-width="2"/><text x="868" y="1