<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1444" viewBox="0 0 1080 1444" role="img" aria-labelledby="title desc">
  <title id="title">DDNZ 供应商评分卡</title>
  <desc id="desc">交付能力、质量水平、服务配合和成本表现四项评分及一票否决条件。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f223b"/><stop offset="1" stop-color="#1d3150"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e8663c"/><stop offset="1" stop-color="#c06ccf"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#071426" flood-opacity=".25"/></filter>
    <style>
      .sans{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif}
      .mono{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace}
    </style>
  </defs>
  <rect width="1080" height="1444" fill="#f4f6f9"/>
  <rect x="38" y="38" width="1004" height="1368" rx="26" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="950" cy="130" r="160" fill="#763c9c" opacity=".2"/>
  <circle cx="1000" cy="120" r="74" fill="#e75b31" opacity=".12"/>
  <text x="92" y="112" fill="#f3a08a" font-size="20" font-weight="800" letter-spacing="4" class="sans">DDNZ GLOBAL  /  SUPPLIER CONTROL</text>
  <text x="92" y="190" fill="#ffffff" font-size="54" font-weight="800" class="sans">供应商评分卡</text>
  <text x="92" y="234" fill="#c8d4e2" font-size="24" class="sans">多指标评价 · 统一报价口径 · 可追溯放行</text>
  <rect x="92" y="270" width="896" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="92" y="330" fill="#ffffff" font-size="26" font-weight="700" class="sans">四项能力，百分制评分</text>
  <text x="988" y="330" fill="#b6c6d9" font-size="19" text-anchor="end" class="mono">TOTAL / 100</text>

  <g class="sans">
    <rect x="92" y="370" width="896" height="166" rx="16" fill="#f8fafc"/>
    <rect x="92" y="370" width="13" height="166" rx="6" fill="#e75b31"/>
    <text x="132" y="416" fill="#10243f" font-size="28" font-weight="800">交付能力</text><text x="940" y="416" fill="#e75b31" font-size="27" font-weight="800" text-anchor="end">30 分</text>
    <text x="132" y="460" fill="#50627a" font-size="20">准时交付率（必评） · 交付弹性（加分项）</text>
    <rect x="132" y="487" width="770" height="10" rx="5" fill="#dce3eb"/><rect x="132" y="487" width="638" height="10" rx="5" fill="#e75b31"/>

    <rect x="92" y="558" width="896" height="166" rx="16" fill="#f8fafc"/>
    <rect x="92" y="558" width="13" height="166" rx="6" fill="#763c9c"/>
    <text x="132" y="604" fill="#10243f" font-size="28" font-weight="800">质量水平</text><text x="940" y="604" fill="#763c9c" font-size="27" font-weight="800" text-anchor="end">40 分</text>
    <text x="132" y="648" fill="#50627a" font-size="20">来料合格率 · 批次合格率 · 质量稳定性</text>
    <rect x="132" y="675" width="770" height="10" rx="5" fill="#dce3eb"/><rect x="132" y="675" width="700" height="10" rx="5" fill="#763c9c"/>

    <rect x="92" y="746" width="896" height="166" rx="16" fill="#f8fafc"/>
    <rect x="92" y="746" width="13" height="166" rx="6" fill="#b15fc3"/>
    <text x="132" y="792" fill="#10243f" font-size="28" font-weight="800">服务配合</text><text x="940" y="792" fill="#763c9c" font-size="27" font-weight="800" text-anchor="end">15 分</text>
    <text x="132" y="836" fill="#50627a" font-size="20">异常响应 · 资料配合 · 问题闭环</text>
    <rect x="132" y="863" width="770" height="10" rx="5" fill="#dce3eb"/><rect x="132" y="863" width="500" height="10" rx="5" fill="#b15fc3"/>

    <rect x="92" y="934" width="896" height="166" rx="16" fill="#f8fafc"/>
    <rect x="92" y="934" width="13" height="166" rx="6" fill="#3f658d"/>
    <text x="132" y="980" fill="#10243f" font-size="28" font-weight="800">成本表现</text><text x="940" y="980" fill="#3f658d" font-size="27" font-weight="800" text-anchor="end">15 分</text>
    <text x="132" y="1024" fill="#50627a" font-size="20">价格竞争力 · 运费资料完整度</text>
    <rect x="132" y="1051" width="770" height="10" rx="5" fill="#dce3eb"/><rect x="132" y="1051" width="530" height="10" rx="5" fill="#3f658d"/>
  </g>

  <rect x="92" y="1150" width="896" height="168" rx="16" fill="#291e35" stroke="#e75b31" stroke-width="2"/>
  <text x="132" y="1200" fill="#f5a28a" font-size="18" font-weight="800" letter-spacing="2" class="sans">RELEASE GATE  /  一票否决</text>
  <text x="132" y="1248" fill="#ffffff" font-size="24" font-weight="700" class="sans">关键质量或交付风险未核实，不进入下一步。</text>
  <text x="132" y="1290" fill="#c9b9d1" font-size="19" class="sans">证据缺口保持开放，直至完成核实并记录。</text>
  <text x="92" y="1362" fill="#9fb0c3" font-size="16" class="mono">DDNZ GLOBAL  ·  SOURCE WITH EVIDENCE</text>
</svg>
