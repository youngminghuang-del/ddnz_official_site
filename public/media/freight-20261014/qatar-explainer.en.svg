<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img"><title>Several suppliers. One clear record.</title><rect width="720" height="960" rx="24" fill="#f7f5fb"/><g font-family="Arial,sans-serif"><text x="50" y="54" font-size="19" fill="#7546ac" font-weight="700" text-anchor="start" direction="ltr">QATAR · SUPPLIER CHECKLIST</text><text x="50" y="110" font-size="34" fill="#262238" font-weight="700" text-anchor="start" direction="ltr">Several suppliers. One clear</text><text x="50" y="156" font-size="34" fill="#262238" font-weight="700" text-anchor="start" direction="ltr">record.</text><rect x="28" y="202" width="664" height="155" rx="18" fill="white" stroke="#e6dfef"/><text x="50" y="247" font-size="29" fill="#7546ac" font-weight="700" text-anchor="start" direction="ltr">01  Identify</text><text x="50" y="293" font-size="28" fill="#262238" font-weight="400" text-anchor="start" direction="ltr">Supplier + order reference</text><rect x="28" y="379" width="664" height="155" rx="18" fill="white" stroke="#e6dfef"/><text x="50" y="424" font-size="29" fill="#7546ac" font-weight="700" text-anchor="start" direction="ltr">02  Record</text><text x="50" y="470" font-size="28" fill="#262238" font-weight="400" text-anchor="start" direction="ltr">Package count + packed size</text><rect x="28" y="556" width="664" height="155" rx="18" fill="white" stroke="#e6dfef"/><text x="50" y="601" font-size="29" fill="#7546ac" font-weight="700" text-anchor="start" direction="ltr">03  Decide</text><text x="50" y="647" font-size="28" fill="#262238" font-weight="400" text-anchor="start" direction="ltr">Ship now / wait / clarify</text><text x="50" y="799" font-size="24" fill="#262238" font-weight="400" text-anchor="start" direction="ltr">Confirm repacking and delivery scope before</text><text x="50" y="835" font-size="24" fill="#262238" font-weight="400" text-anchor="start" direction="ltr">comparing quotes.</text><text x="50" y="907" font-size="17" fill="#6c6576" font-weight="400" text-anchor="start" direction="ltr">ILLUSTRATION · No actual shipment data</text></g></svg>