<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img"><title>عدة مورّدين، وسجل واضح واحد.</title><rect width="720" height="960" rx="24" fill="#f7f5fb"/><g font-family="Arial,sans-serif"><text x="670" y="54" font-size="19" fill="#7546ac" font-weight="700" text-anchor="start" direction="rtl">قطر · قائمة المورّدين</text><text x="670" y="110" font-size="34" fill="#262238" font-weight="700" text-anchor="start" direction="rtl">عدة مورّدين، وسجل واضح واحد.</text><rect x="28" y="202" width="664" height="155" rx="18" fill="white" stroke="#e6dfef"/><text x="670" y="247" font-size="29" fill="#7546ac" font-weight="700" text-anchor="start" direction="rtl">01  حدّد</text><text x="670" y="293" font-size="28" fill="#262238" font-weight="400" text-anchor="start" direction="rtl">المورّد ومرجع الطلب</text><rect x="28" y="379" width="664" height="155" rx="18" fill="white" stroke="#e6dfef"/><text x="670" y="424" font-size="29" fill="#7546ac" font-weight="700" text-anchor="start" direction="rtl">02  سجّل</text><text x="670" y="470" font-size="28" fill="#262238" font-weight="400" text-anchor="start" direction="rtl">عدد الطرود وأبعادها بعد التعبئة</text><rect x="28" y="556" width="664" height="155" rx="18" fill="white" stroke="#e6dfef"/><text x="670" y="601" font-size="29" fill="#7546ac" font-weight="700" text-anchor="start" direction="rtl">03  قرّر</text><text x="670" y="647" font-size="28" fill="#262238" font-weight="400" text-anchor="start" direction="rtl">اشحن الآن / انتظر / استوضح</text><text x="670" y="799" font-size="24" fill="#262238" font-weight="400" text-anchor="start" direction="rtl">أكّد نطاق إعادة التعبئة والتسليم قبل مقارنة</text><text x="670" y="835" font-size="24" fill="#262238" font-weight="400" text-anchor="start" direction="rtl">عروض الأسعار.</text><text x="670" y="907" font-size="17" fill="#6c6576" font-weight="400" text-anchor="start" direction="rtl">رسم توضيحي · لا يتضمن بيانات شحنة فعلية</text></g></svg>