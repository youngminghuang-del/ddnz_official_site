  <script>      
    (function() {        
      try {          
        var originalFetch = window.fetch;          
        var customFetch = originalFetch;          
        Object.defineProperty(window, 'fetch', {            
          configurable: true,            
          enumerable: true,            
          get: function() { return customFetch; },            
          set: function(v) { customFetch = v; }          
        });        
      } catch (e) {          
        console.warn("Could not patch window.fetch property", e);        
      }                
      // Suppress benign ResizeObserver warning messages        
      window.addEventListener('error', function(e) {          
        if (e.message && (e.message.indexOf('ResizeObserver') >= 0 || e.message.indexOf('Resize observer') >= 0)) {            
          e.stopImmediatePropagation();            
          e.preventDefault();          
        }        
      });      
    })();    
  </script>

  <script type="text/javascript">      
    (function(){        
      var redirect = window.location.search.match(/[?&]p=([^&]*)/);        
      if (redirect) {          
        var path = redirect[1].replace(/~and~/g, '&');          
        window.history.replaceState(null, null, window.location.pathname.slice(0, -1) + path + window.location.hash);        
      }      
    })();    
  </script>
